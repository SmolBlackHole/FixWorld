name: Quality

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    public-contracts:
        name: Public contracts on Windows
        runs-on: windows-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Set up .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"

            - name: Run public repository checks
              run: python tools/check.py
