name: Quality

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    public-contracts:
        name: Quality and package on Windows
        runs-on: windows-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Set up .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"

            - name: Run public repository checks
              run: python tools/check.py

            - name: Build distributable package
              run: python tools/build.py --package

            - name: Upload distributable package
              uses: actions/upload-artifact@v4
              with:
                  name: fixworld-pilot-win-x64
                  path: dist/FixWorld-pilot-win-x64.zip
                  if-no-files-found: error
                  retention-days: 14

    release:
        name: Publish main release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: public-contracts
        runs-on: windows-latest
        timeout-minutes: 10
        permissions:
            contents: write

        steps:
            - name: Download distributable package
              uses: actions/download-artifact@v4
              with:
                  name: fixworld-pilot-win-x64
                  path: dist

            - name: Create checksum
              shell: pwsh
              run: |
                  $package = "dist/FixWorld-pilot-win-x64.zip"
                  $digest = (Get-FileHash -Algorithm SHA256 $package).Hash.ToLowerInvariant()
                  "$digest *FixWorld-pilot-win-x64.zip" |
                      Set-Content -Encoding ascii -NoNewline "$package.sha256"

            - name: Publish immutable pilot release
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: pilot-${{ github.run_number }}
              run: |
                  gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName
                  if ($LASTEXITCODE -eq 0) {
                      gh release upload $env:RELEASE_TAG `
                          "dist/FixWorld-pilot-win-x64.zip#FixWorld Windows x64" `
                          "dist/FixWorld-pilot-win-x64.zip.sha256#SHA-256 checksum" `
                          --clobber `
                          --repo $env:GITHUB_REPOSITORY
                      exit $LASTEXITCODE
                  }

                  $shortSha = $env:GITHUB_SHA.Substring(0, 7)
                  $notes = @"
                  Automated pilot package for commit ``$shortSha``.

                  This package passed the repository checks and portable release build. FixWorld
                  is still a pilot; complete in-game validation remains a separate release gate.
                  "@
                  gh release create $env:RELEASE_TAG `
                      "dist/FixWorld-pilot-win-x64.zip#FixWorld Windows x64" `
                      "dist/FixWorld-pilot-win-x64.zip.sha256#SHA-256 checksum" `
                      --target $env:GITHUB_SHA `
                      --title "FixWorld pilot build $env:GITHUB_RUN_NUMBER ($shortSha)" `
                      --notes $notes `
                      --prerelease `
                      --repo $env:GITHUB_REPOSITORY
